# ── 주간 사이트 감사 ──
# 2026-08~09 사고의 공통 패턴: 도구가 없어서가 아니라 아무도 안 돌려서 곪았다.
#   · 매거진 지면 잘림(cqh 버그) — 수동 실행으로야 발견
#   · 갤러리 582MB — 수동 실측으로야 발견
#   · 깨진 이미지(blog #27) — 수동 감사로야 발견
# 이 워크플로가 매주 라이브를 실측하고, 실패하면 이슈를 만든다.
#
# 검사 7종: ①sitemap 상태 ②깨진 이미지 ③매거진 지면 잘림
#           ④실명 노출(P0) ⑤엔드포인트 건강 ⑥SEO 회귀 ⑦외부 링크 rot
# 사람 눈 판정(화질·톤·실기기 터치감)은 자동화 대상이 아니다 —
# 별도 실측 체크리스트(2026-09-03 배포)로 사람이 본다.
#
# 수동 실행: Actions 탭 → site-audit → Run workflow
# 필요한 secrets: SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY (②④⑥⑦용)
name: site-audit

on:
  schedule:
    # 일 18:00 UTC = 월요일 아침 6~7시 NZ — 한 주 시작 전에 결과가 와 있게
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci --omit=optional

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      - name: ① sitemap 전 URL 상태 확인
        id: sitemap
        timeout-minutes: 8
        run: |
          set -uo pipefail
          curl -sf https://www.mhj.nz/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' > /tmp/urls.txt
          total=$(wc -l < /tmp/urls.txt | tr -d ' ')
          echo "sitemap URL: $total개"
          # 직렬 curl 은 최악 135×30s=67분 — 잡 타임아웃은 '취소'라 실패 이슈조차 안 남는다. 8병렬로.
          xargs -P 8 -I{} curl -s -o /dev/null -w '%{http_code} {}\n' -L --max-time 20 {} < /tmp/urls.txt > /tmp/status.txt
          grep -v '^200 ' /tmp/status.txt > /tmp/bad.txt || true
          if [ -s /tmp/bad.txt ]; then
            echo "::error::200이 아닌 URL $(wc -l < /tmp/bad.txt | tr -d ' ')건"
            cat /tmp/bad.txt
            exit 1
          fi
          echo "전부 200 ✅"

      - name: ② 깨진 이미지 전수 감사
        id: images
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-broken-images.mjs

      - name: ③ 매거진 지면 잘림 감사 (창 높이 720/1366)
        id: overflow
        if: ${{ !cancelled() }}
        run: node scripts/magazine-overflow-audit.mjs

      - name: ④ 실명 노출 감사 (P0 — DB 전수 + 라이브 전수)
        id: names
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-name-exposure.mjs

      - name: ⑤ 엔드포인트 건강 (robots·sitemap·llms·feed·schema·og)
        id: endpoints
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node scripts/audit-endpoints.mjs

      - name: ⑥ SEO 회귀 (기준선 scripts/qa/seo-baseline.json 대비)
        id: seo
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-seo-regression.mjs

      - name: ⑦ 외부 링크 rot (404/410 확정만 실패)
        id: links
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-external-links.mjs

      - name: 잘림 스크린샷 보관 (실패 시)
        if: ${{ failure() && steps.overflow.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: overflow-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

      - name: 실패 시 이슈 생성/갱신
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 주간 사이트 감사 실패 — $(date -u +%Y-%m-%d)"
          # body 는 quoted heredoc 으로 — 본문에 따옴표·백틱·괄호가 있어도 bash 가 해석하지 않는다.
          # (첫 실전 실행에서 본문 속 큰따옴표가 body="..." 를 중간에 끊어 exit 2 로 죽었다.
          #  ${{ }} 는 Actions 템플릿 단계에서 치환되므로 quoted heredoc 안에서도 동작한다.)
          body=$(cat <<'ISSUE_BODY'
          자동 감사가 실패했습니다. 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          | 단계 | 결과 |
          |---|---|
          | sitemap 상태 | ${{ steps.sitemap.outcome }} |
          | 깨진 이미지 | ${{ steps.images.outcome }} |
          | 매거진 지면 잘림 | ${{ steps.overflow.outcome }} |
          | 실명 노출 (P0) | ${{ steps.names.outcome }} |
          | 엔드포인트 건강 | ${{ steps.endpoints.outcome }} |
          | SEO 회귀 | ${{ steps.seo.outcome }} |
          | 외부 링크 rot | ${{ steps.links.outcome }} |

          ⚠ 실명 노출 단계가 실패면 로그 말미를 먼저 확인 — "실명 노출"이면 P0 즉시 처리,
          "스캔 불가(감사 불완전)"이면 인프라 문제다. 로그의 이름은 [라벨]로 치환돼 있다.

          로컬 재현:
          ```bash
          node --env-file=.env.local scripts/audit-broken-images.mjs
          node scripts/magazine-overflow-audit.mjs
          node --env-file=.env.local scripts/audit-name-exposure.mjs
          node scripts/audit-endpoints.mjs
          node --env-file=.env.local scripts/audit-seo-regression.mjs
          node --env-file=.env.local scripts/audit-external-links.mjs
          ```
          ISSUE_BODY
          )
          # 같은 라벨의 열린 이슈가 있으면 코멘트, 없으면 생성
          existing=$(gh issue list --label site-audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create site-audit --description "주간 자동 감사" --color D93F0B 2>/dev/null || true
            gh issue create --title "$title" --label site-audit --body "$body"
          fi
