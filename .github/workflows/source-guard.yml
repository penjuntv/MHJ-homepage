# ── 소스 가드 (PR/push 즉시) ──
# 주간 site-audit ⑧과 같은 스크립트를 커밋 시점에 돌린다.
# 이유: select('*') 유출은 주간 주기로는 최대 7일 노출 — P0 는 PR 에서 막아야 한다.
# 네트워크·secrets 불필요, ~10초.
name: source-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  select-star:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: blogs select('*') 소스 가드
        run: node scripts/audit-select-star.mjs

      # 훅은 조용히 fail-open 되기 쉽다(경로 판정·jq 필드·정규식 중 하나만 어긋나도 exit 0).
      # "돌긴 도는데 아무것도 못 막는" 상태를 여기서 잡는다. jq 는 러너에 기본 설치돼 있다.
      - name: select-star-guard 훅 회귀 테스트
        if: ${{ !cancelled() }}
        run: bash scripts/qa/test-select-star-guard.sh
