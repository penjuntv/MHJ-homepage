<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이달의 책 인포그래픽</title>
<style>body { margin: 0; background: #ddd; }</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,600&family=Nunito:wght@700;800&display=swap" data-ig-fonts>
<!-- 렌더링은 infographic-core.js (writer.html 과 공용). render.mjs infographic 이 window.render(d) 를 부른다 -->
<script src="infographic-core.js"></script>
</head>
<body>
<div id="canvas"></div>
<script>
// JSON 의 "kid": "min" | "jin" 이면 그 아이 표기 (기본 현이)
window.render = d => {
  MHJInfographic.mount(document.getElementById('canvas'), d);
  return document.fonts.ready.then(() => { const r = document.createElement('i'); r.id = 'ready'; document.body.append(r); });
};
</script>
</body>
</html>
